name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m compileall -q .
      - run: npm install --ignore-scripts
      - name: Syntax check JS files
        run: |
          set -e
          git ls-files '*.js' '*.mjs' '*.cjs' | grep -v node_modules | grep -v '^web/' | while read -r f; do
            node --check "$f" || exit 1
          done
